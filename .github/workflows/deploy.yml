name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/Hommey
            echo "=== 拉取最新代码 ==="
            git fetch origin main
            git checkout main
            git pull origin main
            echo "=== 当前版本 ==="
            git log --oneline -1
            echo "=== 构建 Docker 镜像 ==="
            cd /home/ubuntu/Hommey/docker
            docker compose build --no-cache
            echo "=== 重启服务 ==="
            docker compose up -d
            echo "=== 等待服务启动 ==="
            sleep 10
            echo "=== 容器状态 ==="
            docker compose ps
            echo "=== 健康检查 ==="
            curl -sI http://127.0.0.1:8000/ | head -5
            echo "=== 部署完成 ==="
