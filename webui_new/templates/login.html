<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>登录 · Hommey</title>
    <link rel="icon" href="/static/brand/hommey-favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/hommey.css?v=20260907-editorial">
    <link rel="stylesheet" href="/static/auth.css?v=20260928-fade-transition">
</head>
<body class="login-page">
    <div class="auth-scenery" id="authScenery" aria-hidden="true">
        <div class="auth-scene-layer is-current"><img src="/static/travel/airport.webp" width="1920" height="1200" alt="" decoding="async" fetchpriority="high"></div>
        <div class="auth-scene-layer"><img width="1920" height="1200" alt="" decoding="async"></div>
    </div>
    <div class="auth-scene-wash" aria-hidden="true"></div>

    <a class="auth-github" href="https://github.com/KOVcharles/Hommey" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 打开 Hommey 项目">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .6A11.4 11.4 0 0 0 8.4 22.8c.57.1.78-.25.78-.55v-2.15c-3.17.69-3.84-1.35-3.84-1.35-.52-1.31-1.27-1.66-1.27-1.66-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.73-1.52-2.53-.29-5.19-1.27-5.19-5.65 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.17A10.9 10.9 0 0 1 12 5.08c.97 0 1.94.13 2.85.39 2.18-1.48 3.14-1.17 3.14-1.17.62 1.57.23 2.73.11 3.02.73.8 1.18 1.82 1.18 3.07 0 4.39-2.67 5.35-5.21 5.63.41.35.78 1.04.78 2.1v3.12c0 .3.21.66.79.55A11.4 11.4 0 0 0 12 .6Z"/></svg>
        <span>GitHub</span>
    </a>

    <main class="auth-page">
        <div class="auth-hero">
            <span class="mini-logo auth-logo" aria-hidden="true">
                <svg viewBox="0 -4 120 64"><path d="M22 46C34 47 40 46 46 41C53 35 53 26 61 19C69 13 78 12 90 12"/><circle cx="14" cy="46" r="8"/><circle class="brand-route-node" cx="101" cy="12" r="11"/></svg>
            </span>
            <h1>Hommey</h1>
            <a class="auth-open" href="/login" data-auth-transition aria-label="前往登录页面">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 10h12m-5-5 5 5-5 5"/></svg>
            </a>
        </div>

        <!-- Keep these scene nodes for the existing background carousel. -->
        <div class="auth-scene-controls" id="sceneControls" hidden aria-hidden="true">
            <span id="sceneLabel">01 / 出发 · 机场晨光</span>
            <div class="auth-scene-buttons">
                <button class="auth-scene-choice" type="button" data-scene="0" data-src="/static/travel/airport.webp" data-label="出发 · 机场晨光" aria-pressed="true"></button>
                <button class="auth-scene-choice" type="button" data-scene="1" data-src="/static/travel/train.webp" data-label="沿途 · 高铁窗外" aria-pressed="false"></button>
                <button class="auth-scene-choice" type="button" data-scene="2" data-src="/static/travel/arrival.webp" data-label="抵达 · 城市傍晚" aria-pressed="false"></button>
                <button class="auth-scene-choice" type="button" data-scene="3" data-src="/static/travel/hotel.webp" data-label="停留 · 酒店时光" aria-pressed="false"></button>
                <button id="scenePause" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="scene-pause-icon" d="M7 5v10m6-10v10"/><path class="scene-play-icon" d="m7 4 8 6-8 6Z"/></svg></button>
            </div>
            <span id="sceneStatus" role="status"></span>
        </div>
    </main>

    <footer class="icp-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">赣ICP备2026020278号</a>
    </footer>
    <script src="/static/auth-background.js?v=20260908-travel-refine" defer></script>
    <script src="/static/auth-transition.js?v=20260928-fade-transition" defer></script>
</body>
</html>
